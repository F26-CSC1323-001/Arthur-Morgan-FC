<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="top-bar">
        <div class="top-bar-left"></div>

        <button id="loginBtn" class="topbarBtn" aria-label="Account">
            <img src="assets/login.png" alt="" width="35" height="35">
        </button>

        <button id="settingsBtn" class="topbarBtn" aria-label="Settings">
            <img src="assets/settings.png" alt="Settings" width="25" height="25">
        </button>
    </div>

    <header>
        <h1>Welcome to SafeHub!</h1>
        <p>Your hub for all things safe.</p>
    </header>

    <main>
        <section id="home-page">
            <h2>Options</h2>
            <p>Find all your security options here!</p>
            <div class="home-button-grid">
                <button id="statBtn">
                    <span>Status</span>
                    <img src="assets/status.png" alt="" class="home-btn-icon">
                </button>
                <button id="helpBtn">
                    <span>Help</span>
                    <img src="assets/help.png" alt="" class="home-btn-icon">
                </button>
                <button id="abtBtn">
                    <span>About</span>
                    <img src="assets/info.png" alt="" class="home-btn-icon">
                </button>
                <button id="accountBtn">
                    <span>Account</span>
                    <img src="assets/login.png" alt="" class="home-btn-icon">
                </button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
