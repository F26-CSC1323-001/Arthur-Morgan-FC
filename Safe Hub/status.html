<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="top-bar">
        <div class="top-bar-left"></div>
        <span>Safe Status</span>
        <button id="settingsBtn" class="topbarBtn" aria-label="Settings">
        <img src="assets/settings.png" alt="Settings" width="25" height="25">
        </button>
    </div>

    <main>
        <section>
            <h2>Status Check</h2>
            <p>View safe status!</p>
            <button id="lockBtn">
                <span>Lock</span>
                <img src="assets/locked.png" alt="" class="btn-icon">
            </button>
            <button id="unlockBtn">
                <span>Unlock</span>
                <img src="assets/unlocked.png" alt="" class="btn-icon">
            </button>
            <button id="vibrateBtn">
                <Span>Vibration</Span>
                <img src="assets/vibration.png" alt="" class="btn-icon">
            </button>
            <button id="lockdownBtn">
                <span>Lockdown</span>
                <img src="assets/siren.png" alt="" class="btn-icon">
            </button>
            <button id="homeBtn">
                <span>Home</span>
                <img src="assets/home.png" alt="" class="btn-icon">
            </button>
            <button id="logsBtn">
                <span>Logs</span>
                <img src="assets/logs.png" alt="" class="btn-icon">
            </button>
    </main>

    <script src="script.js"></script>
</body>
</html>
