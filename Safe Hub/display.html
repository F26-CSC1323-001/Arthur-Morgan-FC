<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="top-bar">
        <div class="top-bar-left"></div>
        <span>Security Logs</span>

        <button id="settingsBtn" class="topbarBtn" aria-label="Settings">
        <img src="assets/settings.png" alt="Settings" width="25" height="25">
        </button>
    </div>
    <main>
        <section>
            <h2>Logs</h2>
            <p>View security logs preview here or click "View Logs" for full access.</p>
            <button id="viewBtn">
                <span>View</span>
                <img src="assets/logs.png" alt="" class="btn-icon">
            </button>
            <button id="clearBtn">
                <span>clear</span>
            </button>
            <button id="backBtn">
                <span>Back</span>
            </button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
