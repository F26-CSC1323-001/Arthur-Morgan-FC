<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="top-bar">
        <div class="top-bar-left"></div>
        <span>Account Info</span>

        <button id="loginsBtn" class="topbarBtn" aria-label="Account">
            <img src="assets/login.png" alt="" width="35" height="35">
        </button>

        <button id="settingsBtn" class="topbarBtn" aria-label="Settings">
            <img src="assets/settings.png" alt="Settings" width="25" height="25">
        </button>
    </div>

    <main>
        <section>
            <h2>Account Data</h2>
            <p>Manage your account and its data here.</p>
            <div>
                <button id="homeBtn">
                    <span>Home</span>
                    <img src="assets/home.png" alt="" class="btn-icon">
                </button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
